name: Deploy Website to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.ripplehub.app/api/v1

     	- name: Clear old build on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: userclaudesession
          key: ${{ secrets.VPS_SSH_KEY }}
          request_pty: true
          command_timeout: 30s
          debug: true
          script: |
            find /var/www/ripplehub-web -mindepth 1 -delete 2>/dev/null || true

      - name: Copy build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: userclaudesession
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./dist/*"
          target: "/var/www/ripplehub-web"

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: userclaudesession
          key: ${{ secrets.VPS_SSH_KEY }}
          request_pty: true
          script: |
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ Website deployed at $(date)"

	
